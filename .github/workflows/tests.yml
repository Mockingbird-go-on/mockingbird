name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Удалено: PYTHON_DIR – теперь Python глобально доступен

jobs:
  # ── Job 1: Unit tests on Ubuntu ──
  test:
    runs-on: ubuntu-latest

    env:
      QT_QPA_PLATFORM: offscreen
      MOCKINGBIRD_HOME: /tmp/mockingbird-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies for Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxcb-xinerama0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            libxkbcommon-x11-0 libegl1 libgl1

      - name: Install Python dependencies
        run: |
          pip install --quiet PySide6 numpy pydantic PyYAML python-dotenv httpx
          pip install --quiet pytest pytest-asyncio pypdf onnxruntime huggingface_hub
          pip install --quiet -e . --no-deps

      - name: Run tests
        run: |
          mkdir -p /tmp/mockingbird-test
          pytest tests/ -q \
            --ignore=tests/test_whisper_engine.py \
            --ignore=tests/test_whisper_model.py \
            --deselect=tests/test_model_integrity.py::test_problem_missing_bin

  # ── Job 2: Build .exe on self-hosted Windows runner ──
  build-windows:
    needs: test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Sync project to build directory
        shell: cmd
        run: |
          # Больше не устанавливаем PYTHON_DIR – он не нужен
          robocopy "${{ github.workspace }}\src" "E:\mockingbird\src" /MIR /XD __pycache__ .pytest_cache /NJH /NJS
          robocopy "${{ github.workspace }}\scripts" "E:\mockingbird\scripts" /MIR /NJH /NJS
          robocopy "${{ github.workspace }}\tests" "E:\mockingbird\tests" /MIR /XD __pycache__ /NJH /NJS
          robocopy "${{ github.workspace }}\vendor" "E:\mockingbird\vendor" /MIR /NJH /NJS
          copy /Y "${{ github.workspace }}\pyproject.toml" "E:\mockingbird\pyproject.toml"
          exit /b 0

      # Опционально: проверить, что Python доступен
      - name: Check Python availability
        shell: powershell
        run: |
          Write-Host "Python version:"
          python --version
          Write-Host "`nPython location:"
          Get-Command python | Select-Object -ExpandProperty Source
          Write-Host "`nPATH entries containing 'python':"
          $env:Path -split ';' | Select-String python

      - name: Build .exe (PyInstaller)
        shell: powershell
        run: |
          Set-Location -Path E:\mockingbird
          Write-Host "Building in: $(Get-Location)"
          # Используем python напрямую – он уже в системном PATH
          .\scripts\build_windows.ps1

      - name: Smoke test
        shell: powershell
        run: |
          Set-Location -Path E:\mockingbird
          $exe = ".\dist\mockingbird\mockingbird-cli.exe"
          if (Test-Path $exe) {
            & $exe --cli < NUL
          } else {
            Write-Error "Executable not found at $exe"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mockingbird-windows-exe
          path: E:\mockingbird\dist\mockingbird\
          retention-days: 30
