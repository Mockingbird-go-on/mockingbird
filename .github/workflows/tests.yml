name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Unit tests on Ubuntu ──
  test:
    runs-on: ubuntu-latest

    env:
      QT_QPA_PLATFORM: offscreen
      MOCKINGBIRD_HOME: /tmp/mockingbird-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies for Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxcb-xinerama0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            libxkbcommon-x11-0 libegl1 libgl1

      - name: Install Python dependencies
        run: |
          pip install --quiet PySide6 numpy pydantic PyYAML python-dotenv httpx
          pip install --quiet pytest pytest-asyncio pypdf onnxruntime huggingface_hub
          pip install --quiet faster-whisper sounddevice openai ctranslate2 "av==14.2.0" --only-binary av
          pip install --quiet -e . --no-deps

      - name: Run tests
        run: |
          mkdir -p /tmp/mockingbird-test
          pytest tests/ -q \
            --ignore=tests/test_whisper_engine.py

  # ── Job 2: Build .exe on self-hosted Windows runner ──
  # ВРЕМЕННО ОТКЛЮЧЕНА (2026-09-22): релизные артефакты собираются вручную
  # через scripts/build.sh; self-hosted раннер недоступен/не нужен.
  # Включить обратно: убрать `false &&` из условия ниже.
  build-windows:
    needs: test
    runs-on: self-hosted
    if: false && github.ref == 'refs/heads/main'
    env:
      # Override on the runner if Python lives elsewhere
      WIN_PY_DIR: '%LOCALAPPDATA%\Programs\Python\Python312'
      WIN_BUILD_DIR: 'E:\mockingbird'

    steps:
      - uses: actions/checkout@v4

      - name: Sync project to build directory
        shell: cmd
        run: |
          robocopy "${{ github.workspace }}\src" "%WIN_BUILD_DIR%\src" /MIR /XD __pycache__ .pytest_cache /NJH /NJS
          robocopy "${{ github.workspace }}\scripts" "%WIN_BUILD_DIR%\scripts" /MIR /NJH /NJS
          robocopy "${{ github.workspace }}\tests" "%WIN_BUILD_DIR%\tests" /MIR /XD __pycache__ /NJH /NJS
          copy /Y "${{ github.workspace }}\pyproject.toml" "%WIN_BUILD_DIR%\pyproject.toml"
          exit /b 0

      - name: Build .exe (PyInstaller)
        shell: cmd
        run: |
          set "PATH=%WIN_PY_DIR%;%WIN_PY_DIR%\Scripts;%PATH%"
          cd /d %WIN_BUILD_DIR%
          powershell.exe -ExecutionPolicy Bypass -File scripts\build_windows.ps1

      - name: Smoke test
        shell: cmd
        run: |
          set "PATH=%WIN_PY_DIR%;%WIN_PY_DIR%\Scripts;%PATH%"
          %WIN_BUILD_DIR%\dist\mockingbird\mockingbird.exe --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mockingbird-windows-exe
          path: dist\mockingbird\
          retention-days: 30