name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Unit tests on Ubuntu ──
  test:
    runs-on: ubuntu-latest

    env:
      QT_QPA_PLATFORM: offscreen
      MOCKINGBIRD_HOME: /tmp/mockingbird-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies for Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxcb-xinerama0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            libxkbcommon-x11-0 libegl1 libgl1

      - name: Install Python dependencies
        run: |
          pip install --quiet PySide6 numpy pydantic PyYAML python-dotenv httpx
          pip install --quiet pytest pytest-asyncio pypdf onnxruntime huggingface_hub
          pip install --quiet -e . --no-deps

      - name: Run tests
        run: |
          mkdir -p /tmp/mockingbird-test
          pytest tests/ -q \
            --ignore=tests/test_whisper_engine.py \
            --ignore=tests/test_whisper_model.py \
            --deselect=tests/test_model_integrity.py::test_problem_missing_bin

  # ── Job 2: Build .exe on self-hosted Windows runner ──
  build-windows:
    needs: test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Sync project to build directory
        shell: powershell
        run: |
          # Add Python to PATH for the runner's service account
          $env:PATH = "C:\Users\Happy\AppData\Local\Programs\Python\Python312;C:\Users\Happy\AppData\Local\Programs\Python\Python312\Scripts;" + $env:PATH
          $src = "${{ github.workspace }}"
          $dst = "E:\mockingbird"
          # Mirror the project — robocopy /MIR deletes files in dst not in src
          robocopy "$src\src" "$dst\src" /MIR /XD __pycache__ .pytest_cache /NJH /NJS
          robocopy "$src\scripts" "$dst\scripts" /MIR /NJH /NJS
          robocopy "$src\tests" "$dst\tests" /MIR /XD __pycache__ /NJH /NJS
          robocopy "$src\vendor" "$dst\vendor" /MIR /NJH /NJS
          Copy-Item "$src\pyproject.toml" "$dst\pyproject.toml" -Force
          # exit code < 8 is success for robocopy
          if ($LASTEXITCODE -lt 8) { $global:LASTEXITCODE = 0 }

      - name: Build .exe (PyInstaller)
        shell: powershell
        run: |
          $env:PATH = "C:\Users\Happy\AppData\Local\Programs\Python\Python312;C:\Users\Happy\AppData\Local\Programs\Python\Python312\Scripts;" + $env:PATH
          cd E:\mockingbird
          powershell.exe -ExecutionPolicy Bypass -File scripts\build_windows.ps1

      - name: Smoke test
        shell: powershell
        run: |
          $env:PATH = "C:\Users\Happy\AppData\Local\Programs\Python\Python312;C:\Users\Happy\AppData\Local\Programs\Python\Python312\Scripts;" + $env:PATH
          $exe = "E:\mockingbird\dist\mockingbird\mockingbird-cli.exe"
          if (Test-Path $exe) {
            "что такое helm`nexit" | & $exe --cli
            Write-Host "Smoke test: OK"
          } else {
            Write-Host "##[error]mockingbird-cli.exe not found after build"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mockingbird-windows-exe
          path: E:\mockingbird\dist\mockingbird\
          retention-days: 30
