[project]
name = "mockingbird"
version = "0.1.0"
description = "Low-latency live speech-to-text desktop app for IT meetings with a term-explanation panel"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "faster-whisper>=1.0",
    "sounddevice>=0.4.6",
    "pyaudiowpatch>=0.2; sys_platform == 'win32'",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "httpx>=0.27",
    "openai>=1.30",
    "PyYAML>=6.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
gigaam = [
    "transformers>=4.57,<5.0",
    "torch>=2.4",
    "torchaudio>=2.4",
    "sentencepiece>=0.1.99",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "numpy>=1.26",
]
 dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pypdf>=4.0",
]

[project.scripts]
mockingbird = "mockingbird.main:main"
mockingbird-cli = "mockingbird.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mockingbird.assets" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
