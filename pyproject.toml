[project]
name = "mockingbird"
dynamic = ["version"]
description = "Low-latency live speech-to-text desktop app for IT meetings with a term-explanation panel"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "faster-whisper>=1.0",
    "sounddevice>=0.4.6",
    "pyaudiowpatch>=0.2; sys_platform == 'win32'",
    "onnxruntime>=1.17",
    "openai>=1.30",
    "huggingface_hub>=0.23",
    "numpy>=1.26",
    "pypdf>=4.0",
    "PyYAML>=6.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pypdf>=4.0",
]

[project.scripts]
mockingbird = "mockingbird.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "mockingbird.__version__" }

[tool.setuptools.package-data]
"mockingbird.assets" = ["*.yaml", "kb/*.yaml", "profiles/*.yaml", "icons/*.svg", "fonts/*.otf", "models/*.onnx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
