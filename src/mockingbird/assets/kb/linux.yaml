topic: linux
title: Linux — всё по теме
keywords: [linux, линукс, оси, операционная система, администрирование]
sections:
  - id: base
    name: Основы Linux
    blocks:
      - q: "Расскажи про иерархию файловой системы Linux (FHS)."
        keywords: [fhs, файловая система, иерархия, директории, структура каталогов]
        a: "**/** — корень; **/etc** — конфигурационные файлы; **/home** — домашние каталоги пользователей; **/var** — изменяемые данные (логи, spool); **/tmp** — временные файлы; **/proc** — псевдо-файловая система процессов; **/dev** — устройства; **/usr** — бинарники и библиотеки; **/bin** и **/sbin** — пользовательские и системные команды; **/opt** — стороннее ПО. Знать FHS важно для поиска файлов и понимания куда что класть."
        related: ["Куда пишутся логи?", "Что находится в /proc?"]
      - q: "Какие бывают типы файлов в Linux?"
        keywords: [типы файлов, regular file, симлинк, symlink, socket, pipe, device, устройство]
        a: "Первый символ **ls -l** определяет тип: **-** обычный файл, **d** директория, **l** символическая ссылка, **c** символьное устройство, **b** блочное устройство, **p** именованный канал (pipe), **s** сокет."
        related: ["Чем жёсткая ссылка отличается от символьной?"]
      - q: "Чем жёсткая ссылка отличается от символьной?"
        keywords: [жёсткая ссылка, hard link, символьная, symlink, inode, ссылки]
        a: "**Hard link** — ещё одно имя для того же **inode**: ссылается на данные, не переживает перенос файла, нельзя для директорий и разных ФС. **Symlink** — отдельный файл с путём назначения: может указывать на директорию и другие ФС, но «ломается», если цель удалена/перемещена."
        related: ["Что такое inode?"]
      - q: "Что такое inode и почему он заканчивается?"
        keywords: [inode, инод, индексный дескриптор, no space, метаданные]
        a: "**Inode** — структура с метаданными файла (владелец, права, размер, блоки данных), хранится в таблице ФС. «No space left on device» при свободных гигабайтах = **закончились inodes** (много мелких файлов). Проверка: `df -i`, просмотр: `ls -i`."
        related: ["Чем ext4 отличается от xfs?"]
      - q: "Как искать файлы и содержимое?"
        keywords: [find, locate, grep, поиск, файлы, содержимое]
        a: "**find /path -name \"*.log\" -mtime -7** — файлы по имени/времени; **grep -r pattern dir** — поиск по содержимому; **locate** — по базе (быстрее, но устаревшая). Комбинации: `find -exec` для действий, `xargs` для пакетной обработки."
        related: ["Что такое xargs?"]
  - id: filesystem
    name: Файловые системы и хранилище
    blocks:
      - q: "Чем ext4 отличается от xfs?"
        keywords: [ext4, xfs, файловая система, разница, журналирование]
        a: "Обе **журналируемые**. **ext4** — стандартная для дистрибутивов, хороша для общих задач и маленьких файлов. **xfs** — масштабируется лучше (большие тома, высокая параллельность), но уменьшить размер тома нельзя. Выбор: ext4 для универсальности, xfs для больших данных."
        related: ["Как узнать тип файловой системы?"]
      - q: "Что такое mount и /etc/fstab?"
        keywords: [mount, fstab, монтирование, точка монтирования, umount]
        a: "**mount** подключает ФС (диск, сетевую шару) к точке монтирования: `mount /dev/sdb1 /mnt/data`. **/etc/fstab** описывает автоматическое монтирование при загрузке (устройство, точка, тип, опции). Проверка: `df -h`, `mount`, размонтирование — `umount`."
        related: ["Как сделать монтирование при загрузке?"]
      - q: "Как посмотреть использование диска и памяти?"
        keywords: [df, du, free, диск, память, usage, занятость]
        a: "**df -h** — занятость ФС; **du -sh dir** — размер каталога; **free -h** — память (total/used/free + **cache/buffers**); **iotop** — диск по процессам. Помнить: «used» в free часто включает кэш — при нехватке он освобождается."
        related: ["Как понять, что не хватает памяти?"]
      - q: "Что такое LVM?"
        keywords: [lvm, logical volume, pv, vg, lv, том]
        a: "**LVM** — слой абстракции над дисками: **PV** (физические тома) → **VG** (группа) → **LV** (логические тома). Даёт **динамическое изменение размера** томов без разбиения, снапшоты. Команды: pvcreate, vgcreate, lvcreate, lvextend, lvs."
        related: ["Как расширить LVM-том?"]
      - q: "Что такое swap и когда он нужен?"
        keywords: [swap, своп, подкачка, swapiness, память]
        a: "**Swap** — раздел/файл подкачки, куда уходят неиспользуемые страницы при нехватке RAM. Полезен против OOM-kill, но **не заменяет память** — интенсивный свопинг сильно замедляет систему. Настраивается `mkswap`/`swapon`, поведение — `vm.swappiness`."
        related: ["Что такое OOM killer?"]
  - id: processes
    name: Процессы
    blocks:
      - q: "Как посмотреть процессы и завершить их?"
        keywords: [процессы, ps, top, htop, kill, pkill, pgrep, сигналы]
        a: "**ps aux** — список процессов; **top / htop** — в реальном времени; **pgrep** — поиск по имени; **kill -15** (TERM) — вежливое завершение, **kill -9** (KILL) — принудительное; **pkill** — по имени; дерево — **pstree**. Порядок: сначала SIGTERM, дать завершиться, при зависании — SIGKILL."
        related: ["Что такое zombie-процесс?", "Что такое сигналы в Linux?"]
      - q: "Что такое zombie-процесс?"
        keywords: [zombie, зомби, defunct, дочерний процесс, wait]
        a: "**Zombie** — завершившийся дочерний процесс, который ещё не «забрал» родитель через **wait()**. Остаётся в таблице процессов как **defunct** и не потребляет ресурсы, но занимает слот. Появляется при неправильном родителе; лечится перезапуском родителя или fix кода."
        related: ["Что такое процесс-сирота?"]
      - q: "Что такое сигналы в Linux?"
        keywords: [сигналы, signals, sigterm, sigkill, sighup, sigstop]
        a: "Механизм уведомления процессов. Основные: **SIGTERM (15)** — вежливое завершение; **SIGKILL (9)** — принудительное (нельзя перехватить); **SIGHUP (1)** — «обрыв терминала», часто перечитывание конфига (nginx -s reload); **SIGSTOP/SIGCONT** — пауза/продолжение; **SIGINT (2)** — Ctrl+C."
        related: ["Чем SIGTERM отличается от SIGKILL?"]
      - q: "Что такое nice и renice?"
        keywords: [nice, renice, приоритет, cpu scheduling, niceness]
        a: "**Nice** — приоритет планировщика CPU от -20 (высший) до +19 (низший), по умолчанию 0. **renice** меняет его для запущенного процесса. Обычные пользователи могут только повышать nice (делать менее приоритетным), снижать — только root."
        related: ["Как посмотреть приоритет процессов?"]
      - q: "Как запускать команды в фоне?"
        keywords: [фон, background, nohup, disown, fg, bg, jobs, and]
        a: "**cmd &** — в фоне; **Ctrl+Z** — пауза; **jobs** — список; **bg/fg** — перевод между фоном и передним планом; **nohup cmd &** — переживёт закрытие терминала (игнорирует SIGHUP); **disown** — «открепить» от терминала. Для служб в production — systemd, не nohup."
        related: ["Чем nohup отличается от disown?"]
      - q: "Что находится в /proc?"
        keywords: [proc, /proc, псевдофайловая, cpuinfo, meminfo, cmdline]
        a: "**/proc** — псевдо-ФС с данными ядра: **/proc/cpuinfo** (CPU), **/proc/meminfo** (память), **/proc/loadavg** (нагрузка), **/proc/<pid>/** (информация о процессе: cmdline, status, fd, environ), **/proc/sys/** (настройки ядра). Инструмент диагностики без доп. утилит."
        related: ["Как узнать, что делает процесс?"]
  - id: systemd
    name: Systemd и сервисы
    blocks:
      - q: "Как создать сервис в systemd?"
        keywords: [systemd, unit, юнит, сервис, systemctl, daemon-reload]
        a: "Создать unit-файл **/etc/systemd/system/myapp.service** с секциями **[Unit]** (Description, After), **[Service]** (ExecStart, Restart=on-failure, User), **[Install]** (WantedBy=multi-user.target). Затем **systemctl daemon-reload**, **systemctl enable --now myapp**. Проверка: **systemctl status myapp**."
        related: ["Чем Restart=always отличается от on-failure?"]
      - q: "Чем Restart=always отличается от Restart=on-failure?"
        keywords: [restart, always, on-failure, перезапуск, systemd]
        a: "**on-failure** — перезапуск только при ненулевом коде выхода (сбой), **always** — всегда, включая «чистое» завершение (например, когда процесс сам вызвал exit). Практика: для сервисов, которые не должны «умирать», часто выбирают always, но учитывать вечные рестарт-циклы (RestartSec)."
        related: ["Что такое socket activation?"]
      - q: "Что такое socket activation?"
        keywords: [socket activation, сокет, ленивый запуск, systemd]
        a: "systemd создаёт сокет заранее, а сервис **запускается только при первом соединении** (ленивый старт, меньше ресурсов). Реализуется парой unit: `*.socket` и `*.service`. Используется для sshd, контейнерных рантаймов, микросервисов."
        related: ["Чем systemd отличается от SysV init?"]
      - q: "Чем systemd отличается от SysV init?"
        keywords: [sysvinit, init, параллельный запуск, journald, логос]
        a: "**systemd** запускает юниты **параллельно** по зависимостям, умеет перезапускать сервисы, логирует через **journald**, поддерживает socket/dbus/временную активацию и таймеры вместо cron. **SysV init** — последовательные скрипты из /etc/init.d, без отслеживания зависимостей."
        related: ["Что такое socket activation?"]
      - q: "Как посмотреть логи сервиса?"
        keywords: [журнал, journalctl, логи, logs, systemd journal]
        a: "**journalctl -u myservice** — логи юнита; **-f** — следить; **-k** — ядро; **--since \"1 hour ago\"** — по времени; **-p err** — уровень. Чтобы журнал пережил перезагрузку: **Storage=persistent** в /etc/systemd/journald.conf."
        related: ["Где лежат классические логи приложений?"]
      - q: "Чем systemd timer отличается от cron?"
        keywords: [systemd timer, cron, таймер, расписание, монотонно]
        a: "**systemd timer** — таймеры с точными календарными (**OnCalendar**) и монотонными (**OnUnitActiveSec**) расписаниями, интеграция с журналом и зависимостями, можно пропускать пропущенные запуски (**Persistent=true**). **cron** — проще, только календарные, но и легче."
        related: ["Что такое cron?"]
  - id: text
    name: Текстовые инструменты
    blocks:
      - q: "Как использовать grep и регулярные выражения?"
        keywords: [grep, регулярки, regex, egrep, rg, поиск по тексту]
        a: "**grep pattern file** — поиск по строкам; **-i** — без учёта регистра, **-v** — инвертировать, **-r** — рекурсивно, **-c** — посчитать, **-l** — файлы. **rg** (ripgrep) быстрее. Регулярные выражения: `^`/`$`, `.*`, `[a-z]`, `\\b` — граница слова."
        related: ["Как посчитать количество вхождений?"]
      - q: "Что делает sed?"
        keywords: [sed, стрим-редактор, замена, substitution, regexp]
        a: "**sed** — потоковый редактор: **sed 's/old/new/g' file** — замена; **-i** — на месте; **d** — удалить строки; адресация: `sed -n '10,20p'`. Не путать с awk: sed — замена по строкам, awk — анализ и агрегация по полям."
        related: ["Чем sed отличается от awk?"]
      - q: "Что такое awk?"
        keywords: [awk, анализ текста, поля, печать, aggregate]
        a: "**awk** — язык обработки текста по полям: **awk '{print $1, $2}' file** — колонки; **-F** — разделитель (по умолчанию пробел); условия и агрегация: `awk '$3 > 100 {sum+=$3} END {print sum}'`. Используется для быстрых аналитических выкладок из логов."
        related: ["Чем awk отличается от cut?"]
      - q: "Что такое sort, uniq и xargs?"
        keywords: [sort, uniq, xargs, пайплайн, обработка текста]
        a: "**sort** — сортировка (**-n** числовая, **-k** по колонке); **uniq -c** — уникальные с подсчётом (требует сортировки); **xargs** — превращает поток строк в аргументы команды: `find ... | xargs rm`, с **-I{}** — подстановка. Основа текстовых пайплайнов."
        related: ["Что такое pipe?"]
      - q: "Что такое pipe и перенаправление?"
        keywords: [pipe, пайплайн, перенаправление, redirect, stdin stdout stderr, te]
        a: "**`|`** передаёт stdout одной команды в stdin другой. Перенаправление: **>** (перезапись), **>>** (дописать), **2>** (stderr), **&>** (все), **<** (вход из файла). **tee** пишет и в файл, и дальше. Стандартные потоки: **stdin (0), stdout (1), stderr (2)**."
        related: ["Что такое /dev/null?"]
  - id: bash
    name: Bash-скриптинг
    blocks:
      - q: "Из чего состоит bash-скрипт и exit codes?"
        keywords: [bash, скрипт, shebang, shebang, exit code, код возврата]
        a: "Заголовок **#!/bin/bash** (shebang) — интерпретатор; каждая команда возвращает **exit code** (0 = успех, ненулевой = ошибка); скрипт завершается **exit N**. Проверка: `$?`. Сделать исполняемым: **chmod +x** и запуск `./script.sh`."
        related: ["Что такое set -euo pipefail?"]
      - q: "Что такое переменные и параметры в bash?"
        keywords: [переменные, параметры, "$1", "$@", "$?", окружение, export]
        a: "**var=value** (без пробелов!), использование **$var**; параметры скрипта **$1, $2, $@, $#**; спецпеременные: **$?** (код последней команды), **$$** (PID), **$0** (имя скрипта). **export** делает переменную доступной дочерним процессам."
        related: ["Как передать аргументы в скрипт?"]
      - q: "Как писать условия и циклы в bash?"
        keywords: [if, for, while, циклы, условия, "[[ ]]", case]
        a: "**if [[ $x -gt 5 ]]; then ...; fi** — условия (для строк/чисел: -eq, -ne, -gt, -lt; для файлов: -f, -d, -x). Циклы: **for i in ...; do ...; done**, **while [ ... ]**. **case** — множественный выбор. Строки в [[ ]] без лишних кавычек."
        related: ["Чем [ ] отличается от [[ ]]?"]
      - q: "Что такое set -euo pipefail?"
        keywords: [set euo pipefail, bash strict, ошибки, пайплайн]
        a: "**set -e** — выход при любой ошибке; **-u** — ошибка при использовании неопределённой переменной; **-o pipefail** — пайплайн падает, если падает любая часть. Вместе дают «строгий режим», чтобы скрипты не игнорировали сбои. Стандарт для production-скриптов."
        related: ["Что такое exit code?"]
      - q: "Что такое /dev/null и /dev/zero?"
        keywords: [/dev/null, /dev/zero, черная дыра, подавить вывод]
        a: "**/dev/null** — «чёрная дыра»: всё записанное исчезает, чтение пустое. Подавление вывода: `cmd > /dev/null 2>&1`. **/dev/zero** — бесконечный поток нулевых байтов (для `dd if=/dev/zero of=...`)."
        related: ["Что такое перенаправление?"]
  - id: network
    name: Сеть и диагностика
    blocks:
      - q: "Как диагностировать проблемы с сетью?"
        keywords: [диагностика, ping, traceroute, mtr, ss, netstat, tcpdump, curl, ip addr]
        a: "**ping** — доступность хоста; **traceroute / mtr** — путь и потери; **ss -tlnp** — слушающие порты и процессы; **ip addr / ip route** — адреса и маршруты; **curl -v** — HTTP-диагностика; **tcpdump** — захват пакетов; **dig** — DNS. Логика: сначала L2/L3 (ping, ip), потом L4 (ss), потом L7 (curl)."
        related: ["Как узнать какой процесс слушает порт?"]
      - q: "Как проверить DNS?"
        keywords: [dns, dig, nslookup, host, resolv.conf, getent]
        a: "**dig example.com** — подробно; **nslookup / host** — быстрая проверка; **cat /etc/resolv.conf** — какие DNS-серверы; **getent hosts example.com** — как резолвит сама система (с учётом /etc/hosts)."
        related: ["Что такое TTL записи?"]
      - q: "Как узнать, какой процесс слушает порт?"
        keywords: [порт, ss, netstat, lsof, слушает, listening]
        a: "**ss -tlnp** — TCP-сокеты и процессы; **ss -ulnp** — UDP; **netstat -tulpn** — классика; **lsof -i :8080** — по конкретному порту. Понимание, кто слушает порт, — первый шаг диагностики «порт занят»."
        related: ["Что такое порт?"]
  - id: users
    name: Пользователи и права
    blocks:
      - q: "Как добавить пользователя и дать права суперпользователя?"
        keywords: [пользователь, useradd, adduser, sudo, wheel, sudoers]
        a: "**useradd -m -s /bin/bash name** (или **adduser**), пароль — **passwd name**. Права sudo: добавить в группу **wheel** (или sudo) — это описано в **/etc/sudoers** (через visudo). Лучшие практики: запретить прямой вход root, использовать sudo и ключи, не пароли."
        related: ["Что такое /etc/shadow?"]
      - q: "Что такое /etc/passwd, /etc/shadow и /etc/group?"
        keywords: [passwd, shadow, group, учетные записи, пароли]
        a: "**/etc/passwd** — пользователи и их UID/GID, домашние каталоги, оболочки (пароли скрыты). **/etc/shadow** — хэши паролей и политика срока действия (доступен только root). **/etc/group** — группы и их участники. Редактировать через **vipw/vigr**, не вручную."
        related: ["Что такое UID?"]
      - q: "Чем su отличается от sudo?"
        keywords: [su, sudo, различие, root, права]
        a: "**su -** — полностью переключиться на другого пользователя (обычно root), зная его пароль. **sudo cmd** — выполнить одну команду от root/другого пользователя по правам из **/etc/sudoers**, требует только свой пароль и **логируется** в аудит. Для администрирования используют sudo."
        related: ["Что такое visudo?"]
      - q: "Что такое SUID и чем он опасен?"
        keywords: [suid, setuid, setgid, бит, безопасность, повышение прав]
        a: "**SUID-бит** (`chmod u+s`) запускает файл **от имени владельца**, а не запустившего — это механизм для системных утилит (passwd). Опасен: найденный SUID-root бинарник = **привилегированная эскалация**. Искать: `find / -perm -4000 2>/dev/null`. Вместо SUID-скриптов — sudo-правила."
        related: ["Что такое sticky bit?"]
      - q: "Что такое sticky bit?"
        keywords: [sticky bit, sticky, chmod, /tmp, удаление файлов]
        a: "**Sticky bit** (`chmod +t`) на директории разрешает **удалять/переименовывать файлы только их владельцу** (и root), даже если у других есть write. Классика — **/tmp** (drwxrwxrwt). Снимает проблему «все могут удалять чужие файлы» в общих каталогах."
        related: ["Что такое ACL?"]
      - q: "Что такое ACL в Linux?"
        keywords: [acl, setfacl, getfacl, права, расширенные]
        a: "**ACL** дают **более гибкие права**, чем rwx для трёх групп: отдельные права для конкретных пользователей и групп на один файл. Команды: **getfacl/setfacl** (`setfacl -m u:alice:rw file`). Нужен параметр `acl` при монтировании ФС."
        related: ["Чем chmod отличается от chown?"]
  - id: perf
    name: Производительность
    blocks:
      - q: "Какие утилиты для анализа производительности Linux?"
        keywords: [производительность, top, htop, iostat, vmstat, sar, free, perf, mpstat]
        a: "**top/htop** — CPU и память; **free -h** — память; **vmstat** — своп и нагрузка; **iostat** — диски (await, %util); **sar** — исторические данные; **mpstat** — по ядрам; **perf** — профилирование. Методика: смотреть CPU → память → диск → сеть по очереди."
        related: ["Как понять, что не хватает памяти?"]
      - q: "Как понять, что не хватает памяти?"
        keywords: [память, oom, swap, free, утечка, memory]
        a: "Признаки: **swap активно растёт**, постоянная загрузка диска, процессы получают **OOM-kill** (dmesg: \"Out of memory\"). Диагностика: **free -h** (used + buff/cache), **top** по %MEM, поиск утечек через **smem**/`/proc/<pid>/status`. Кэш освобождается автоматически — это не утечка."
        related: ["Что такое OOM killer?"]
      - q: "Что такое load average?"
        keywords: [load average, нагрузка, uptime, средняя]
        a: "**Load average** (из `uptime`/top) — среднее число **процессов в очереди на CPU** за 1/5/15 минут. Нагрузка > числа ядер = CPU перегружен (но включает и процессы в D-состоянии — дисковые ожидания). Смотреть тренд, а не одно значение."
        related: ["Что такое iowait?"]
      - q: "Что такое OOM killer?"
        keywords: [oom killer, out of memory, оом, убийца, cgroup]
        a: "**OOM killer** — механизм ядра, который при исчерпании памяти **принудительно убивает процессы** (выбирает по «плохости»). Логи: dmesg. Защита: лимиты (cgroup), swap, `oom_score_adj` для важных сервисов. Отключить нельзя — это последняя защита системы."
        related: ["Как защитить процесс от OOM?"]
      - q: "Что такое cgroups?"
        keywords: [cgroups, контроль групп, лимиты, cpu memory io, control group]
        a: "**cgroups** — механизм ядра для **ограничения и учёта ресурсов** группы процессов: CPU, память, IO, pids. Лучшие практики: **двухфазная** — сначала фильтрация, затем scoring. Два поколения: cgroup v1 (иерархии по контроллерам) и **cgroup v2** (единая иерархия) — основа для Docker/k8s."
        related: ["Как ограничить память процесса?"]
