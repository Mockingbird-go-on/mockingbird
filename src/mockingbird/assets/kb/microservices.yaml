topic: microservices
title: Микросервисная архитектура — всё по теме
keywords: [микросервисы, microservices, saga, circuit breaker, service discovery, api gateway, bounded context, ddd, event driven, grpc, rest, rpc]
sections:
  - id: fundamentals
    name: Основы микросервисов
    blocks:
      - q: "Что такое микросервисная архитектура?"
        keywords: [микросервисы, microservices, монолит, декомпозиция, bounded context, независимость, масштабируемость]
        a: "**Микросервисы** — архитектурный стиль: приложение = набор небольших **независимых сервисов**, каждый со своей БД, отвечающих за конкретную бизнес-функцию (**bounded context**). Связь через API (REST/gRPC/сообщения). Плюсы: независимый деплой, масштабирование per-сервиса, технологическая гибкость, отказоустойчивость (один сервис падает — остальные живы). Минусы: сложность распределённости (network latency, consistency), операционные накладные (мониторинг, логи, deployment N сервисов), сложность отладки. **Monolith → Microservices**: декомпозиция по бизнес-доменам (DDD), не по техслоям. **Anti-pattern**: distributed monolith — сервисы развёрнуты отдельно, но жёстко связаны (shared DB, синхронные цепочки)."
        related: ["Что такое bounded context?", "Чем микросервисы отличаются от монолита?"]
      - q: "Что такое bounded context и domain-driven design?"
        keywords: [bounded context, ограниченный контекст, ddd, domain driven design, aggregate, ubiquitous language]
        a: "**DDD (Domain-Driven Design)** — методология проектирования от бизнес-домена. **Bounded Context** — граница, внутри которой модель (и терминология) консистентна. Пример: «User» в контексте Auth (id+credentials), в Billing (id+payment method), в Shipping (id+address) — разные модели, разные контексты. **Ubiquitous Language** — разработчики и бизнес используют одни термины. **Aggregate** — кластер объектов как единое целое (Order + Items), изменяется атомарно. **Service = Bounded Context** → границы микросервиса = границы домена. **Anti-pattern**: CRUD-декомпозиция (service per table) → хаос связей. **Event Storming** — техника: domain experts + sticky notes → выявить contexts/events."
        related: ["Что такое aggregate?", "Как декомпозировать монолит?"]
      - q: "Чем синхронное взаимодействие отличается от асинхронного в микросервисах?"
        keywords: [синхронное, асинхронное, sync, async, rest, grpc, message queue, event driven, request response]
        a: "**Синхронное** (REST/gRPC): запрос-ответ, клиент ждёт ответа. Плюсы: просто, immediate feedback, easy debugging. Минусы: temporal coupling (оба должны быть alive), cascade failures (цепочка падает), blocking threads. **Асинхронное** (events/messages через Kafka/RabbitMQ): отправил событие → забыл. Плюсы: loose coupling, scalability, resilience. Минусы: eventual consistency, сложнее отладка, ordering. **Выбор**: sync для queries/commands требующих immediate result (GET user, POST login); async для notifications, integrations, long-running tasks, event-driven workflows. **Anti-pattern**: sync-chain из 5 сервисов (synchronous orchestration) → latency = сумма, надёжность = произведение."
        related: ["Что такое event-driven?", "Что такое circuit breaker?"]
  - id: patterns
    name: Паттерны устойчивости
    blocks:
      - q: "Что такое circuit breaker паттерн?"
        keywords: [circuit breaker, предохранитель, closed, open, half open, resilience4j, hystrix, fallback]
        a: "**Circuit Breaker** — защита от каскадных отказов: если downstream-сервис падает, breaker разрывает цепь, предотвращая лавину запросов. **Состояния**: **Closed** (норма, запросы идут), **Open** (ошибок > порога → быстрые fail без реального запроса), **Half-Open** (после timeout → пробный запрос; успех → Closed, fail → Open снова). Параметры: `failureRate` (% ошибок), `waitDurationInOpenState` (сколько держать open), `slidingWindowSize` (окно подсчёта). **Fallback** — что делать когда circuit open (cached data, default value, queue for later). **Инструменты**: Resilience4j (Java), Polly (.NET), opossum (Node), Istio DestinationRule. **vs Retry**: retry для transient errors, circuit для sustained failures."
        related: ["Что такое retry?", "Что такое bulkhead?"]
      - q: "Что такое bulkhead паттерн?"
        keywords: [bulkhead, переборка, isolation, thread pool, connection pool, resource limits, isolation]
        a: "**Bulkhead** — изоляция ресурсов: разные сервисы/операции используют **отдельные пулы** (thread pools, connection pools, memory). Если один сервис «завис» и забрал все потоки — остальные продолжают работать. Аналогия: отсеки на корабле (вода в одном не топит весь корабль). **Реализация**: отдельный thread pool per downstream service; semaphore (max concurrent); timeout per pool. **В Istio**: `connectionPool` per upstream. **В Java**: `@Bulkhead` (Resilience4j) — ограничивает concurrent invocations. **vs Circuit Breaker**: bulkhead ограничивает ресурсы (защита от исчерпания), circuit breaker ограничивает запросы (защита от отказов downstream). **Вместе** они образуют robust resilience."
        related: ["Что такое circuit breaker?", "Что такое rate limiting?"]
      - q: "Как правильно реализовать retry и exponential backoff?"
        keywords: [retry, ретрай, exponential backoff, jitter, idempotency, thundering herd, transient error]
        a: "**Retry** — повтор запроса при transient error (timeout, 503, network). **Exponential backoff**: задержка растёт — 1с → 2с → 4с → 8с (геометрическая). **Jitter** — случайная добавка (±20%) → предотвращает **thundering herd** (все ретраят одновременно). **Max retries** — 3-5 (не бесконечно). **Idempotency** — обязательна: повтор POST/PUT не должен создавать дубль (idempotency key / unique constraint). **Retryable errors**: transient (5xx, timeout, connection reset). **Non-retryable**: 4xx (клиентская ошибка — повтор не поможет). **Circuit breaker + Retry**: retry для мгновенных сбоев, circuit для устойчивых. **В gRPC**: retry policy + backoff в service config. **В Istio**: `retries.attempts`, `retries.perTryTimeout`. **Anti-pattern**: retry на cascade (A→B→C, каждый ретраит → экспоненциальный рост нагрузки)."
        related: ["Что такое circuit breaker?", "Что такое idempotency?"]
      - q: "Что такое idempotency и почему она важна?"
        keywords: [idempotency, идемпотентность, at least once, duplicate, idempotency key, safe retry]
        a: "**Идемпотентность** — повторный вызов даёт тот же результат, что и первый. GET — идемпотентен по природе (чтение). PUT — идемпотентен (перезаписывает состояние). POST — **не идемпотентен** (повтор создаёт дубль). DELETE — идемпотентен (удаление уже удалённого = ok). **Для POST**: используйте **idempotency key** (UUID от клиента) — сервер проверяет: уже видел этот ключ → возвращает предыдущий результат. **Stripe**: `Idempotency-Key` header. **Альтернатива**: unique constraint в БД (order_id) → duplicate insert → constraint violation → safe. **Зачем нужно**: в распределённых системах retry неизбежен (at-least-once delivery) → без идемпотентности → двойной платёж, двойная запись. **Тест**: отправь тот же запрос 3 раза → проверь одно состояние."
        related: ["Что такое retry?", "Что такое at-least-once?"]
  - id: service_discovery
    name: Service Discovery и API Gateway
    blocks:
      - q: "Что такое service discovery и как оно работает?"
        keywords: [service discovery, обнаружение сервисов, consul, etcd, dns discovery, health check, registry]
        a: "**Service Discovery** — механизм автоматического нахождения сервисов друг другом. Два подхода: (1) **Client-side** — клиент сам запрашивает registry (Consul, Eureka) → получает список инстансов → балансирует. (2) **Server-side** — клиент → LB/proxy → LB запрашивает registry и перенаправляет. **В K8s**: **Service** + **DNS** (kube-dns/CoreDNS) + **kube-proxy** (iptables/IPVS) — transparent discovery. **В Consul**: service registration (agent) + health checks + DNS/HTTP API → клиенты резолвят `my-service.service.consul`. **Регистрация**: self-registration (сервис при старте) или sidecar (Envoy sidecar регистрирует). **Health checks**: active (poll) / passive (из трафика). **Сбой**: stale registry → запросы на «мёртвый» инстанс → retry/circuit. **Service Mesh** (Istio/Linkerd) — встроенный discovery через xDS."
        related: ["Что такое Consul?", "Как работает Kubernetes Service?"]
      - q: "Что такое API Gateway и когда он нужен?"
        keywords: [api gateway, api gw, kong, ambassador, aws api gateway, routing, auth, rate limit, aggregation]
        a: "**API Gateway** — единая точка входа для внешних клиентов (мобильное приложение, web, сторонний API). Функции: (1) **Routing** — запрос → нужный микросервис по пути/host. (2) **Auth** — JWT/OAuth валидация (клиент не дёргает каждый сервис для auth). (3) **Rate limiting** — per-client/per-API лимиты. (4) **Aggregation** — один запрос клиента → несколько запросов к сервисам → объединённый ответ (BFF — Backend for Frontend). (5) **Transformation** — protocol/version translation (REST→gRPC, v1→v2). (6) **Observability** — logging, metrics per route. **Инструменты**: Kong, Ambassador (Envoy), AWS API Gateway, Tyk, Nginx+. **Anti-pattern**: API Gateway как business logic container (должен быть thin). **vs Service Mesh**: Gateway — external-in, Mesh — internal-between-services."
        related: ["Чем API Gateway отличается от Service Mesh?", "Что такое BFF?"]
      - q: "Что такое BFF (Backend for Frontend)?"
        keywords: [bff, backend for frontend, specialization, mobile, web, aggregation, single purpose]
        a: "**BFF (Backend for Frontend)** — специализированный backend (или API Gateway слой) для конкретного клиента: один BFF для mobile, другой для web SPA, третий для partner API. Зачем: (1) разные data shapes (mobile — меньше данных на экране), (2) разные protocols (mobile — gRPC, web — REST), (3) aggregation (один экран = данные из 3 сервисов → BFF агрегирует за один запрос). **Преимущества**: клиент получает ровно то что нужно, без over-fetching; разделение ответственности. **Минус**: больше кода (3 BFF вместо 1). **Anti-pattern**: один BFF для всех → снова монолит. **Реализация**: GraphQL BFF (Apollo), custom microservice (Node/Spring), API Gateway с lambda aggregation. **Принадлежность**: команда frontend владеет своим BFF → fast iteration."
        related: ["Что такое API Gateway?", "Что такое GraphQL?"]
      - q: "Чем gRPC отличается от REST?"
        keywords: [grpc, rest, protobuf, json, http2, streaming, bidirectional, contract, сравнение]
        a: "**gRPC**: binary protocol (Protobuf), HTTP/2, **contract-first** (proto-файл = контракт), bidirectional streaming, сильная типизация, автогенерация клиентов (Go/Java/Python/JS/N). Быстрее REST (binary vs JSON, HTTP/2 multiplexing), ниже overhead. **REST**: текстовый (JSON), HTTP/1.1 или HTTP/2, **resource-oriented** (URL-ы), широко поддерживается (browsers, curl), гибкий (HATEOAS, версионирование в URL). **Выбор**: gRPC для service-to-service (низкая задержка, типизированный контракт, streaming). REST для external APIs (браузеры, простота, экосистема). **gRPC-Web** — gRPC в браузере (через proxy). **GraphQL** — альтернатива REST (query язык, клиент запрашивает нужные поля). **Подводный камень**: gRPC сложнее отладки (binary), нужен proto-registry."
        related: ["Что такое Protobuf?", "Чем gRPC отличается от GraphQL?"]
  - id: data_consistency
    name: Консистентность и распределённые транзакции
    blocks:
      - q: "Как обеспечить консистентность данных в микросервисах?"
        keywords: [consistency, консистентность, saga, 2pc, eventual, outbox, cdc, distributed transaction]
        a: "**Проблема**: каждый сервис — своя БД → нет распределённой транзакции (ACID). Подходы: (1) **2PC** (two-phase commit) — координатор → prepare → commit всем. Слишком медленно, blocking, SPOF (координатор). Редко используется. (2) **Saga** — цепочка локальных транзакций + компенсация при сбое. Orchestration или Choreography. (3) **Outbox pattern** — событие пишется в БД в той же транзакции → CDC (Debezium) публикует в Kafka. Гарантия «не потерять событие». (4) **Eventual consistency** — данные согласованы «в конце концов» (через события). (5) **CQRS** — separate read/write models, sync через события. **Принцип**: prefer eventual consistency + idempotency + компенсация, avoid distributed locks/2PC."
        related: ["Что такое saga?", "Что такое outbox pattern?"]
      - q: "Что такое outbox pattern?"
        keywords: [outbox, паттерн, event table, cdc, debezium, reliable publishing, transactional outbox]
        a: "**Outbox** — надёжная публикация событий без распределённой транзакции. Шаги: (1) бизнес-операция (update order status) + событие (OrderStatusChanged) пишутся в БД **в одной локальной транзакции** — outbox-таблица. (2) **CDC** (Debezium на WAL/binlog) или **polling publisher** читает outbox → публикует в Kafka/RabbitMQ. (3) После публикации → помечает/удаляет запись. **Гарантия**: если транзакция в БД прошла — событие **обязательно** будет опубликовано (at-least-once). **Проблема без outbox**: commit БД + publish в Kafka → publish может упасть → событие потеряно. **Идемпотентность**: consumer должен обрабатывать дубликаты (CDC может отправить дважды). **Performance**: CDC на WAL — почти zero overhead. **Polling** — простой, но нагружает БД."
        related: ["Что такое CDC?", "Что такое Debezium?"]
      - q: "Что такое CQRS?"
        keywords: [cqr, cqr, command query responsibility segregation, separate models, read model, projection, event sourcing]
        a: "**CQRS (Command Query Responsibility Segregation)** — разделение операций **записи** (Commands: create/update/delete) и **чтения** (Queries: select). Модели: **Write model** (optimised for consistency, normalised, aggregates), **Read model** (optimised for queries, denormalised, projections). Синхронизация: write → event → проекция обновляет read model. **Преимущества**: независимое масштабирование (read-heavy → много реплик read), оптимизированные схемы (different shapes for different screens), кэширование read model. **Event Sourcing** — часто вместе: store events (не state) → state восстанавливается replay-ем событий. **Минусы**: complexity, eventual consistency между write/read, инфраструктура (event store, projections, replay). **Use case**: high-write + high-read + разные projections (dashboard, history, analytics). **Anti-pattern**: CQRS для CRUD без нужды → лишняя сложность."
        related: ["Что такое Event Sourcing?", "Что такое projection?"]
      - q: "Чем saga orchestration отличается от choreography?"
        keywords: [saga, orchestration, choreography, coordinator, centralized, decentralized, event driven]
        a: "**Orchestration**: есть **saga-оркестратор** (state machine) → вызывает сервисы последовательно → при ошибке → вызывает компенсации в обратном порядке. Сервисы не знают о saga — только отвечают на команды. Плюсы: видимость flow (оркестратор знает состояние), проще отладка, easier rollback. Минусы: оркестратор = SPOF + bottleneck. **Choreography**: нет координатора — каждый сервис слушает события и реагирует автономно. A → event → B → event → C. Плюсы: decentralized, no SPOF. Минусы: сложнее отслеживать flow («кто что делает?»), циклические зависимости, сложнее откат. **Выбор**: orchestration для сложных/длинных saga (3+ шагов, строгий flow); choreography для простых цепочек (2-3 сервиса). **Tempo/Cadence** — workflow engines для orchestration. **В Kubernetes**: custom operator как оркестратор."
        related: ["Что такое saga?", "Что такое компенсация?"]
