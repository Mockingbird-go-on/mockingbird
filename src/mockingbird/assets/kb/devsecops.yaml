topic: devsecops
title: DevSecOps — всё по теме
keywords: [devsecops, безопасность, security, безопасная разработка, sdlc]
sections:
  - id: fundamentals
    name: Основы DevSecOps
    blocks:
      - q: "Что такое DevSecOps?"
        keywords: [devsecops, безопасность, культура, shift left]
        a: "**DevSecOps** — интеграция **безопасности в процессы DevOps** с самого начала (shift left), а не на финальном этапе: автоматические проверки, ответственность команд за безопасность своего кода, безопасность как инженерная практика. Цель — безопасность без торможения доставки."
        related: ["Что такое shift left?"]
      - q: "Что такое shift left в безопасности?"
        keywords: [shift left, смещение влево, ранняя проверка, sdlc]
        a: "**Shift left** — перенос проверок безопасности **на ранние стадии** (IDE, commit, PR), где исправление дёшево, вместо конца пайплайна. Инструменты: линтеры секретов, SAST в CI, проверка зависимостей. Не отменяет финальный аудит, но уменьшает стоимость дефектов."
        related: ["Что такое DevSecOps?"]
      - q: "Что такое secure SDLC?"
        keywords: [secure sdlc, безопасный цикл, требования, threat model, код]
        a: "**Безопасный жизненный цикл ПО**: требования безопасности → **threat modeling** → безопасное проектирование → статический анализ (SAST) → проверка зависимостей → security-тестирование (DAST, пентест) → **review перед релизом** → мониторинг/реагирование. Каждый этап — свой слой защиты."
        related: ["Что такое threat modeling?"]
      - q: "Что такое threat modeling?"
        keywords: [threat modeling, моделирование угроз, stride, dra, risk]
        a: "**Threat modeling** — анализ системы на угрозы на этапе проектирования: что важно (данные, доступ), как атакуют (**STRIDE**), риск, контрмеры. Отвечает на «какие угрозы и как их закрыть» до написания кода. Дешевле исправлять архитектуру, чем уязвимости в проде."
        related: ["Что такое secure SDLC?"]
      - q: "Что такое security in CI/CD?"
        keywords: [security, ci cd, проверки, gates, безопасность пайплайна]
        a: "Проверки в пайплайне: **SAST** (исходники), **SCA** (зависимости), **секрет-сканеры**, **контейнер-скан** (Trivy), **IaC-скан** (Checkov), подпись артефактов, approval для прод-выкатки. Плюс защита самого пайплайна: доступы, не доверять untrusted-вкладу, изоляция раннеров."
        related: ["Что такое SAST и SCA?"]
  - id: testing
    name: Тестирование безопасности
    blocks:
      - q: "Что такое SAST и SCA?"
        keywords: [sast, sca, статический анализ, зависимости, cve]
        a: "**SAST** — анализ исходников без запуска (шаблоны уязвимостей, потоки данных): Semgrep, SonarQube, CodeQL. **SCA** — проверка зависимостей на **CVE** и лицензии: Dependabot, Trivy, Snyk, OWASP Dependency-Check. SAST на PR, SCA при обновлении зависимостей."
        related: ["Что такое DAST?"]
      - q: "Что такое DAST?"
        keywords: [dast, динамический анализ, сканер, запущенное приложение, owasp]
        a: "**DAST** — тестирование **запущенного приложения** «снаружи» (как хакер): сканеры (**OWASP ZAP, Burp Suite, Acunetix**) ищут XSS, SQL-инъекции, ошибки конфигурации. Не видит внутренний код, но видит реальное поведение. Дополняет SAST."
        related: ["Что такое SAST?"]
      - q: "Чем SAST отличается от DAST?"
        keywords: [sast, dast, сравнение, статический, динамический, разница]
        a: "**SAST** смотрит **внутрь — на исходный код** без запуска (Semgrep, SonarQube, CodeQL): ловит дефекты в коде, но не реальное поведение. **DAST** смотрит **снаружи — на работающее приложение** (ZAP, Burp): находит уязвимости, которые видны атакующему. Они дополняют друг друга и используются на разных этапах: SAST — раньше и дешевле, DAST — на запущенных средах."
        related: ["Что такое SAST и SCA?", "Что такое DAST?"]
      - q: "Что такое SCA и SBOM?"
        keywords: [sca, sbom, инвентарь зависимостей, компоненты, cve]
        a: "**SBOM (Software Bill of Materials)** — формализованный **список компонентов** и версий приложения (зависимости, библиотеки). **SCA** использует SBOM для сверки с базами уязвимостей. Формат: CycloneDX, SPDX. SBOM требуется в зрелых security-процессах и некоторых стандартах."
        related: ["Что такое SCA?"]
      - q: "Что такое pen test?"
        keywords: [pentest, пентест, тестирование на проникновение, red team]
        a: "**Pen test** — санкционированная атака на систему для поиска уязвимостей реальными методами. В отличие от сканеров — глубже, с анализом и эксплуатацией. Бывает black-box (без информации), white-box (с доступом), gray-box. Итог — отчёт с рисками и рекомендациями."
        related: ["Чем DAST отличается от pen test?"]
      - q: "Что такое security champions?"
        keywords: [security champions, чемпионы безопасности, адвокаты, команда]
        a: "**Security champions** — выделенные инженеры в командах разработки, которые продвигают безопасность: помогают с review, внедряют инструменты, являются связующим звеном с центральной security-командой. Масштабирует безопасность без роста числа безопасников."
        related: ["Что такое DevSecOps?"]
  - id: secrets
    name: Секреты и доступы
    blocks:
      - q: "Как управлять секретами?"
        keywords: [секреты, secrets, vault, ротация, не в коде]
        a: "Секреты — в **secret manager** (Vault, AWS SM, GCP SM, Azure KV): доступ по ролям, **ротация** ключей, аудит. Не в коде, не в env, не в логах, не в git. Скринин: **git-secrets, trufflehog, gitleaks** в CI ловят утёкшие ключи. Принцип: секрет в момент доступа, а не в конфиге."
        related: ["Что такое secret scanner?"]
      - q: "Что такое secret scanning в CI?"
        keywords: [secret scanning, gitleaks, trufflehog, утечка, ключи]
        a: "**Secret scanners** (gitleaks, trufflehog, GitHub secret scanning) ищут в коде и коммит-истории ключи/токены (регулярками, эвристикой). Работают на PR и в истории. При находке — блокировка merge, отзыв и **ротация ключа** (секрет считается скомпрометированным)."
        related: ["Как управлять секретами?"]
      - q: "Что такое принцип наименьших привилегий?"
        keywords: [least privilege, наименьшие привилегии, права, iam, принцип]
        a: "**Least privilege** — давать **минимально необходимые права** для задачи: пользователю, сервису, сервисному аккаунту, роли IAM. Снижает blast radius утечки/взлома. Практика: раздельные роли, нет «всем root», регулярный ревью прав, аудит использования."
        related: ["Что такое IAM?"]
      - q: "Что такое IAM?"
        keywords: [iam, identity and access, роли, политики, аутентификация]
        a: "**IAM** — управление идентификацией и доступом (AWS IAM, GCP IAM): **пользователи, роли, политики, service accounts**. Политика = кто, что может, над чем. Ошибки IAM — главный источник утечек в облаке (слишком широкие роли, открытые бакеты)."
        related: ["Что такое least privilege?"]
  - id: supply_chain
    name: Безопасность цепочки поставок
    blocks:
      - q: "Что такое supply chain security?"
        keywords: [supply chain, цепочка поставок, зависимости, атака, slsa]
        a: "**Supply chain security** — защита цепочки: от зависимостей и библиотек до артефактов и CI. Атаки: компрометация зависимости, подмена пакета, взлом реестра/CI. Меры: **пиннинг версий**, SCA, **SLSA**, подпись, доверие реестрам, изоляция сборки."
        related: ["Что такое SLSA?"]
      - q: "Что такое SLSA?"
        keywords: [slsa, supply chain, уровни, фреймворк, integrity]
        a: "**SLSA (Supply-chain Levels for Software Artifacts)** — фреймворк уровней зрелости цепочки поставок: **SLSA 1-4** от «документация» до «полная изоляция и интеграция с инкумбери». Требования: воспроизводимость сборки, подписанные артефакты, контроль CI. Стандарт доверия к артефактам."
        related: ["Что такое supply chain security?"]
      - q: "Что такое подпись артефактов (cosign)?"
        keywords: [cosign, подпись, артефакт, sigstore, верификация]
        a: "**Подпись артефактов** — криптографическая подпись образов/пакетов, чтобы гарантировать, **кто** собрал и **что не подменено**. Инструмент: **cosign** (Sigstore), `cosign sign`/`verify`. Проверка на этапе деплоя: деплоим только подписанные артефакты."
        related: ["Что такое SLSA?"]
      - q: "Что такое base image и почему важна безопасность?"
        keywords: [base image, базовый образ, дистрибутив, минимальный, апдейты]
        a: "**Base image** — фундамент образа контейнера; его уязвимости переходят в ваше приложение. Правила: минимальные образы (**distroless, alpine**, scratch), **регулярные обновления** (rebuild), пиннинг digest, сканирование (Trivy). Чем меньше слоёв и пакетов — тем меньше поверхность атаки."
        related: ["Что такое image scanning?"]
  - id: container
    name: Безопасность контейнеров
    blocks:
      - q: "Что такое image scanning?"
        keywords: [image scanning, сканирование образов, trivy, clair, уязвимости]
        a: "**Скан образов** на уязвимости ОС и зависимостей: **Trivy, Grype, Clair, Anchore**. Запускается в CI (до публикации) и в кластере (периодически). Политика: запрет образов с критичными CVE. Скан — проверка «внутренностей» слоёв, не заменяет SAST/SCA."
        related: ["Что такое base image?"]
      - q: "Что такое rootless контейнеры и why non-root?"
        keywords: [rootless, non root, не root, runasnonroot, привилегии]
        a: "**Non-root** — контейнер работает с обычным пользователем (USER, runAsNonRoot): даже при взломе процесса нет root-прав. **Rootless** — контейнерный демон/runtime без root вообще (cgroups по namespace). Оба снижают риск **container escape** и компрометации хоста."
        related: ["Что такое container escape?"]
      - q: "Что такое SBOM для контейнеров?"
        keywords: [sbom, контейнер, инвентарь, компоненты, образ]
        a: "**SBOM контейнера** — список пакетов ОС и библиотек в образе. Инструменты (Trivy, syft) генерируют SBOM из слоёв. Хранение SBOM рядом с образом позволяет быстро понять влияние новой CVE и проверить соответствие. Стандарт — CycloneDX/SPDX."
        related: ["Что такое image scanning?"]
      - q: "Что такое security hardening и как его применяют к контейнерам и кластерам?"
        keywords: [hardening, kubescape, gatekeeper, укрепление, безопасность кластера, политики безопасности]
        a: "Комплекс мер: **RBAC** минимально, **NetworkPolicy** изоляция, **seccomp/AppArmor**, `runAsNonRoot`, read-only FS, лимиты ресурсов, сканирование образов, **Pod Security Admission / Gatekeeper (OPA)** как политики. Инструменты аудита: **kube-bench, kubescape**. Контроль — не точечный, а постоянный."
        related: ["Что такое Pod Security Standards?"]
  - id: cloud
    name: Безопасность облака и compliance
    blocks:
      - q: "Что такое misconfiguration и как её ловить?"
        keywords: [misconfiguration, неверная конфигурация, с3, бакеты, cloud]
        a: "**Misconfiguration** — главная причина утечек в облаке: открытые **S3-бакеты**, слишком широкие SG, публичные инстансы. Инструменты: **ScoutSuite, Prowler, CloudSploit, Checkov (IaC)** непрерывно сканируют конфигурацию. Политика: default-deny, аудит, запрет публичных ресурсов."
        related: ["Что такое policy as code?"]
      - q: "Что такое CSPM?"
        keywords: [cspm, cloud security posture, облачная безопасность, аудит]
        a: "**CSPM (Cloud Security Posture Management)** — автоматическая оценка безопасности облачной конфигурации: сканирование против бенчмарков (**CIS**, NIST), поиск рисков, remediation. Инструменты: Prisma Cloud, Wiz, ScoutSuite, Prowler. Отвечает на «насколько безопасно настроено облако»."
        related: ["Что такое misconfiguration?"]
      - q: "Что такое compliance (SOC 2, GDPR)?"
        keywords: [compliance, soc2, gdpr, pci, соответствие, аудит]
        a: "**Compliance** — соответствие требованиям регуляторов/стандартов: **SOC 2** (контроли безопасности), **GDPR** (персональные данные), **PCI DSS** (платёжные данные), ISO 27001. Реализуется через **политики, логирование, контроли, аудит** и проверяется независимыми аудиторами."
        related: ["Что такое audit log?"]
      - q: "Что такое audit logging?"
        keywords: [audit log, аудит, журнал, cloudtrail, логирование действий]
        a: "**Audit log** — журнал действий: кто, что, когда (cloudtrail, activity logs, auth events). Критично для security: расследование инцидентов, compliance, обнаружение аномалий. Требования: централизованное хранение, защита от изменения (immutable), retention, алерты на критические события."
        related: ["Что такое compliance?"]
      - q: "Что такое zero trust?"
        keywords: [zero trust, нулевое доверие, моделирование, verify, network]
        a: "**Zero trust** — «не доверять никому по умолчанию»: каждый доступ **проверяется** (identity, device, context), сегментация сети, микросегментация, mTLS между сервисами, least privilege. Вместо «внутри сети доверяем» — верификация каждого запроса."
        related: ["Что такое mTLS?"]
