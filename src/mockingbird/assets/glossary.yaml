  - term: "Helm"
    aliases: ["helm", "хелм", "helm chart", "helm charts", "чарт", "чарты", "гельм", "хельм", "чарт хелм", "хелм чарт"]
    normalized: "Helm"
    explanation: "Пакетный менеджер для Kubernetes: чарты описывают приложение через шаблоны и values, позволяют ставить и обновлять релизы одной командой."
    examples: ["Поставили приложение через Helm chart."]
    category: infra
    related:
      - question: "Из чего состоит Helm chart?"
        answer: "Директория чарта: **Chart.yaml** (метаданные: name, version, dependencies), **values.yaml** (параметры по умолчанию), **templates/** (Go-шаблоны манифестов) и **_helpers.tpl** (вспомогательные шаблоны). Любые значения из values подставляются в шаблоны через {{ .Values... }}."
      - question: "Как работает helm install, upgrade и rollback?"
        answer: "`helm install` создаёт **release** из чарта с фиксированной версией и набором values. `helm upgrade` создаёт новую **revision** (история хранится в Secret); `helm rollback --revision N` откатывает к нужной. Каждый release — отдельная версия состояния, это и даёт откаты."
      - question: "Какой приоритет у values в Helm?"
        answer: "От низкого к высокому: дефолты из **values.yaml** чарта < файлы `-f/--values` (последний побеждает) < `--set`/`--set-string`. В чартах есть и `values.schema.json` для валидации. Для переопределения сложных структур используют --set с нотацией path и list-индексами."


