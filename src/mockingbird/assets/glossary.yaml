    examples: ["Запустим MVP через месяц."]
    category: product

  - term: "SLA"
    normalized: "Service Level Agreement"
    explanation: "Соглашение об уровне сервиса: зафиксированные метрики доступности и времени отклика (например, 99.9%)."
    examples: ["По SLA у нас доступность 99.9%."]
    category: ops
    related:
      - question: "Что такое SLO и SLI и как они связаны с SLA?"
        answer: "SLI — измеримая метрика (например, доля успешных запросов), SLO — целевое значение SLI (например, 99.9% за месяц), SLA — внешнее обязательство с санкциями. Сначала SLI и SLO внутри, потом SLA наружу."

