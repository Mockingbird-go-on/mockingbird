    examples: ["Попросим LLM объяснить термин."]
    category: ml
    related:
      - question: "В чём разница между fine-tuning и RAG?"
        answer: "Fine-tuning — дообучение модели на своих данных: меняет поведение модели, дорого, нужен датасет и вычисления. RAG — подстановка нужного контекста из базы в промпт: дёшево, актуально, легко обновлять. RAG обычно выбирают первым."

