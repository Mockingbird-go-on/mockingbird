terms:
  - term: "CI/CD"
    aliases: ["ci cd", "ci/cd pipeline", "cicd", "сиай сиди", "цисиди", "сисиди"]
    normalized: "Continuous Integration / Continuous Delivery"
    explanation: "Практика автоматизации сборки, тестирования и доставки кода. CI собирает и проверяет каждое изменение, CD разворачивает его в среду."
    examples: ["Мы выкатываем через CI/CD.", "CI/CD пайплайн упал на этапе тестов."]
    category: devops
    related:
      - question: "В чём разница между CI и CD?"
        answer: "CI (непрерывная интеграция) — автоматическая сборка и тесты на каждое изменение. CD (непрерывная доставка) — автоматическое развёртывание сборки в среды и готовность к релизу. CI отвечает за «получилось ли собрать», CD — за «попал ли результат в среду»."

  - term: "Kubernetes"
    aliases: ["k8s", "kube", "кубер", "кубернетис", "кубернетес", "кейтэйтэс", "кубик"]
    normalized: "Kubernetes (K8s)"
    explanation: "Открытая платформа оркестрации контейнеров: автоматизирует деплой, масштабирование и управление контейнерными приложениями."
    examples: ["Кластер Kubernetes перезапустил поды.", "Развернём сервис в k8s."]
    category: infra
    related:
      - question: "В чём отличие Deployment от StatefulSet?"
        answer: "Deployment — для stateless-приложений: реплики без стабильных имён, быстрое масштабирование и обновления. StatefulSet — для stateful: стабильные имена (pod-0, pod-1), стабильный сетевой идентификатор, отдельный PVC на реплику и гарантированный порядок старта."
      - question: "Что делает kube-apiserver?"
        answer: "Это фронтенд control plane: единственная точка входа для всех операций кластера. Принимает REST-запросы, выполняет аутентификацию и авторизацию, валидацию, а состояние хранит в etcd."

  - term: "Docker"
    aliases: ["docker", "докер", "дохер"]
    normalized: "Docker"
    explanation: "Инструмент для упаковки приложений и зависимостей в изолированные контейнеры, которые одинаково работают на любой машине."
    examples: ["Запусти базу в Docker.", "Собери образ через Dockerfile."]
    category: infra
    related:
      - question: "В чём отличие ENTRYPOINT от CMD?"
        answer: "CMD задаёт команду и аргументы по умолчанию и легко переопределяется в docker run. ENTRYPOINT фиксирует исполняемый процесс контейнера и переопределяется только через --entrypoint. Если заданы оба, CMD передаётся аргументами в ENTRYPOINT. Практика: ENTRYPOINT — процесс, CMD — его дефолтные аргументы."
      - question: "Как почистить неиспользуемые контейнеры и образы?"
        answer: "docker system prune удаляет остановленные контейнеры, сети и dangling-образы; docker image prune -a удаляет все неиспользуемые образы. docker system df показывает занятое место."

  - term: "Nexus"
    aliases: ["nexus", "нексус", "нэксус", "nexus repository", "nexus repository manager", "сонатайн нексус", "sonatype nexus"]
    normalized: "Nexus (Sonatype Nexus Repository Manager)"
    explanation: "Самостоятельно размещаемый репозиторий артефактов от Sonatype: хранит пакеты (Maven, npm, PyPI, Docker, NuGet), проксирует публичные реестры и группирует их в единые точки доступа. Даёт retention-политики, поиск, безопасность и стабильность сборок без внешних реестров."
    examples: ["Публикуем сборки в Nexus.", "Nexus проксирует Maven Central."]
    category: devops
    related:
      - question: "Чем hosted, proxy и group-репозитории в Nexus отличаются?"
        answer: "**Hosted** — собственное хранилище публикаций (свои артефакты, релизы/snapshots). **Proxy** — кэширующий прокси до удалённого реестра (Maven Central, npmjs), тянет зависимость один раз и хранит локально. **Group** — объединение нескольких hosted/proxy за одним URL: клиент указывает только группу."
      - question: "Какие форматы поддерживает Nexus?"
        answer: "**Maven/Java**, **npm**, **PyPI**, **Docker** (OCI/Helm-чарты тоже), **NuGet**, **Raw** (произвольные файлы), **Golang**, **R** и др. Для каждого формата свой набор полей (groupId/artifactId, имя пакета, тег) и политики уникальности версий."
      - question: "Как работает retention и политики хранения в Nexus?"
        answer: "**Cleanup policies** удаляют компоненты по возрасту/числу версий/последнему использованию; **storage facet** — quota и авто-удаление. Хорошая практика: отдельные hosted-репозитории для **release** и **snapshot**, число хранимых snapshot-версий ограничено, для Docker — keep N последних тегов."

  - term: "VMware"
    aliases: ["vmware", "вэмвеа", "виэмвеа", "вмваре", "ви эм веа", "vsphere", "esxi", "вспера", "эсэксэй"]
    normalized: "VMware (vSphere/ESXi)"
    explanation: "Платформа виртуализации для частных облаков и дата-центров: гипервизор ESXi, оркестратор vCenter, инструменты vMotion, HA и DRS. Позволяет запускать много ВМ на одном железе и управлять кластером серверов как пулом ресурсов."
    examples: ["Виртуалки живут на VMware ESXi.", "vCenter управляет кластером VMware."]
    category: cloud
    related:
      - question: "Чем ESXi отличается от vCenter?"
        answer: "**ESXi** — type-1 гипервизор, ставится прямо на железо и запускает ВМ (bare-metal). **vCenter** — централизованное управление несколькими ESXi-хостами: кластеры, шаблоны, лицензии, мониторинг. Один ESXi можно вести и сам по себе; vCenter нужен для масштабирования и HA/DRS."
      - question: "Что такое vMotion и HA в VMware?"
        answer: "**vMotion** — живая миграция ВМ между хостами без остановки (память копируется, диск шарится на shared storage). **HA (High Availability)** — автоматический перезапуск ВМ на другом хосте при отказе. **DRS** — балансировка нагрузки: миграция ВМ по загрузке хостов."
      - question: "Чем виртуальная машина VMware отличается от контейнера?"
        answer: "**VM** — полная гостевая ОС поверх гипервизора: тяжёлая, но изоляция на уровне ядра, можно Linux и Windows на любом железе. **Контейнер** — процесс на общем ядре хоста (Docker/k8s): легче и быстрее, но изоляция слабее. VMware — про инфраструктуру/приватные облака, контейнеры — про приложения."

  - term: "API"
    aliases: ["апи"]
    normalized: "Application Programming Interface"
    explanation: "Набор правил и методов, по которым одна программа общается с другой."
    examples: ["У сервиса есть REST API.", "Прокинуть данные через API."]
    category: general
    related:
      - question: "В чём разница между REST и gRPC?"
        answer: "REST — HTTP + JSON: человеку читаемо, простая интеграция, широко поддерживается. gRPC — HTTP/2 + Protocol Buffers: бинарный и быстрее, поддерживает потоковую передачу, но требует генерации кода по .proto."

  - term: "REST"
    aliases: ["restful", "rest api"]
    normalized: "Representational State Transfer"
    explanation: "Архитектурный стиль HTTP-API, где ресурсы адресуются по URL, а действия задаются методами GET/POST/PUT/DELETE."
    examples: ["У нас REST-эндпоинт /users."]
    category: backend
    related:
      - question: "Что такое идемпотентность в API?"
        answer: "Свойство операции давать одинаковый результат при повторных одинаковых запросах. Например, PUT идемпотентен, а POST — нет; это важно для ретраев и распределённых систем."

  - term: "SQL"
    aliases: ["эс кью эл"]
    normalized: "Structured Query Language"
    explanation: "Язык запросов к реляционным базам данных."
    examples: ["Напиши SQL-запрос на выборку."]
    category: data
    related:
      - question: "Что такое индекс в БД и зачем он нужен?"
        answer: "Индекс — структура (обычно B-дерево), ускоряющая поиск строк по колонке: быстрее SELECT/WHERE/JOIN, но медленнее INSERT/UPDATE и больше места. Создаётся через CREATE INDEX."
      - question: "Чем JOIN отличается от подзапроса?"
        answer: "JOIN объединяет строки двух таблиц по условию и отдаёт колонки обеих; подзапрос в SELECT/WHERE выдаёт скаляр, множество или таблицу и выполняется независимо. Часто результат одинаков, но JOIN обычно читаемее и быстрее."

  - term: "NoSQL"
    normalized: "NoSQL"
    explanation: "Категория баз данных, не использующих табличную SQL-модель (ключ-значение, документы, графы). Примеры: Redis, MongoDB."
    examples: ["Это хранилище на NoSQL."]
    category: data

  - term: "Redis"
    aliases: ["редис"]
    normalized: "Redis"
    explanation: "Высокопроизводительное in-memory key-value хранилище, используется для кэша, очередей и pub/sub."
    examples: ["Сложим результат в Redis."]
    category: data
    related:
      - question: "Как инвалидировать кэш?"
        answer: "Три классические схемы: cache-aside (читать через кэш, писать в БД и сбрасывать ключ), write-through (писать в кэш и БД одновременно), write-behind (писать в БД асинхронно). Обязателен TTL как страховка от рассинхрона."

  - term: "MVP"
