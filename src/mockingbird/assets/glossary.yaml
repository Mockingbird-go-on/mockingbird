        answer: "CPU — мало ядер с высокой частотой, оптимизирован для последовательных задач. GPU — тысячи простых ядер, массовый параллелизм, оптимален для матричных вычислений (ML, рендеринг). CUDA/ROCm — интерфейсы доступа к GPU."

